name: Build Prem AI Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/prem/aiassistant
          mkdir -p app/src/main/res/values
            echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PremAIAssistant"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.prem.aiassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.prem.aiassistant"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6D4AFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Prem AI Assistant">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/prem/aiassistant/MainActivity.kt <<'EOF'
          package com.prem.aiassistant

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {

              private val purple = Color.rgb(109, 74, 255)

              private fun button(text: String, action: () -> Unit) =
                  Button(this).apply {
                      this.text = text
                      isAllCaps = false
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(purple)
                      setOnClickListener { action() }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  home()
              }

              private fun home() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(24, 40, 24, 24)
                  }

                  layout.addView(
                      TextView(this).apply {
                          text = "Prem AI Assistant"
                          textSize = 30f
                          gravity = Gravity.CENTER
                      }
                  )

                  layout.addView(
                      TextView(this).apply {
                          text = "🤖 AI Chat • 🎬 Video • 📱 Reels"
                          textSize = 16f
                          gravity = Gravity.CENTER
                          setPadding(0, 12, 0, 30)
                      }
                  )

                  layout.addView(button("🤖 AI Chat") {
                      screen("AI Chat", "अपना सवाल लिखें…")
                  })

                  layout.addView(button("📱 AI Reel Maker") {
                      screen("Reel Maker", "जैसे: हनुमान जी की दमदार Reel बनाओ")
                  })

                  layout.addView(button("🎬 AI Video Maker") {
                      screen("Video Maker", "अपना video idea लिखें…")
                  })

                  setContentView(layout)
              }

              private fun screen(title: String, hint: String) {

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 35, 24, 24)
                  }

                  layout.addView(button("← Home") { home() })

                  layout.addView(
                      TextView(this).apply {
                          text = title
                          textSize = 27f
                          setPadding(0, 20, 0, 15)
                      }
                  )

                  val input = EditText(this).apply {
                      this.hint = hint
                      minLines = 5
                      gravity = Gravity.TOP
                  }

                  val result = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 20, 0, 0)
                  }

                  layout.addView(input)

                  layout.addView(button("✨ Generate") {
                      val text = input.text.toString()

                      result.text =
                          if (text.isBlank()) {
                              "पहले अपना prompt लिखें।"
                          } else {
                              "Prem AI Assistant\\n\\nआपका prompt:\\n$text\\n\\nAI generation के लिए backend जोड़ना होगा।"
                          }
                  })

                  layout.addView(result)

                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: |
          ./gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prem-AI-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

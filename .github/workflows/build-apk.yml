name: Build Prem AI Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/prem/aiassistant
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PremAIAssistant"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.prem.aiassistant"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.prem.aiassistant"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Prem AI Assistant"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/prem/aiassistant/MainActivity.kt <<'EOF'
          package com.prem.aiassistant

          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private fun button(text: String, action: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      setTextColor(Color.WHITE)
                      setOnClickListener { action() }
                  }
              }

              private fun base(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(24, 32, 24, 32)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  home()
              }

              private fun home() {
                  val layout = base()

                  val title = TextView(this).apply {
                      text = "🤖 Prem AI Assistant"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTextColor(Color.BLACK)
                  }

                  layout.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  layout.addView(
                      button("🤖 AI Chat") {
                          screen("AI Chat", "आप AI से सवाल पूछ सकते हैं।")
                      }
                  )

                  layout.addView(
                      button("🎬 AI Reel Maker") {
                          screen("AI Reel Maker", "यहाँ से अपनी 30 सेकंड की शानदार Reel बनाएं।")
                      }
                  )

                  layout.addView(
                      button("🎥 AI Video Maker") {
                          screen("AI Video Maker", "अपनी कहानी को cinematic video में बदलें।")
                      }
                  )

                  setContentView(layout)
              }

              private fun screen(title: String, message: String) {
                  val layout = base()

                  val heading = TextView(this).apply {
                      text = title
                      textSize = 28f
                      gravity = Gravity.CENTER
                  }

                  val text = TextView(this).apply {
                      this.text = message
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(10, 30, 10, 30)
                  }

                  val back = button("⬅️ वापस") {
                      home()
                  }

                  layout.addView(heading)
                  layout.addView(text)
                  layout.addView(back)

                  setContentView(layout)
              }
          }
          EOF

      - name: Build APK
        run: |
          ./gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prem-AI-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
